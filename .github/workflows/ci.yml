# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every pull
# request and every push to main, on a clean machine. A pull request is ready when this is green.
# Not on every push too: a pull request's branch would run twice per change, both runs' end-to-end
# tests at once, on the same GITHUB_TOKEN limits (code search: 10 a minute; the API: 1,000 an hour).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Run again by visual-baselines.yml once it has committed new baselines: its push starts no run itself.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # What this run's token may still ask of GitHub: an end-to-end failure on a rate limit shows here.
      # Asking for the limits counts against none of them.
      - name: GitHub limits
        run: >-
          curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit
          | jq -c '.resources | {core, search, code_search}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The real CLI on real repositories at fixed commits; the token lists their large trees.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture

  # The demo as visual tests (tests/visual): its screenshots against the baselines, every run on video.
  # In the Playwright image, pinned by digest, as in visual-baselines.yml: the same Chromium, the same fonts.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:visual
      # The videos, and for a failure its screenshot, the baseline and the diff: every run, passed or failed.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-tests
          path: |
            test-results/
            playwright-report/
          retention-days: 14
