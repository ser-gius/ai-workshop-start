# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every pull
# request and every push to main, on a clean machine. A pull request is ready when this is green.
# Not on every push too: a pull request's branch would run twice per change, both runs' end-to-end
# tests at once, on the same GITHUB_TOKEN limits (code search: 10 a minute; the API: 1,000 an hour).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on real repositories at fixed commits; the token lists their large trees.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
